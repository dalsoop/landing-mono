name: deploy

on:
  push:
    branches: [main]
    paths: ["apps/**", "router/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: landing-mono
  ROOT_DOMAIN: external.kr

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::저장소 시크릿 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 가 필요합니다(README 의 저장소 설정 참고)."
            exit 1
          fi
      - name: build
        id: build
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          sites=""
          for dir in apps/*/; do
            site=$(basename "$dir")
            if ! echo "$site" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
              echo "::error::apps/$site: 폴더 이름은 도메인에 쓸 수 있는 소문자·숫자·하이픈이어야 합니다."
              exit 1
            fi
            if [ ! -f "$dir/index.html" ]; then
              echo "::error::apps/$site: index.html 이 없습니다."
              exit 1
            fi
            cp -R "$dir" "dist/$site"
            sites="$sites $site"
          done
          cp router/_worker.js dist/_worker.js
          echo "sites=$sites" >> "$GITHUB_OUTPUT"
          echo "배포할 사이트:$sites"
      - name: ensure Pages project
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$PAGES_PROJECT")
          if [ "$code" = "404" ]; then
            npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch main
          elif [ "$code" != "200" ]; then
            echo "::error::Pages 프로젝트 조회 실패: HTTP $code"; exit 1
          fi
      - name: deploy
        run: npx --yes wrangler@3 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
      - name: attach domains
        env:
          SITES: ${{ steps.build.outputs.sites }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains"
          have=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result[]?.name')
          for site in $SITES; do
            domain="$site.$ROOT_DOMAIN"
            if echo "$have" | grep -qx "$domain"; then
              echo "연결됨: https://$domain"
            else
              curl -sf -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                --data "{\"name\":\"$domain\"}" "$api" > /dev/null
              echo "새로 연결: https://$domain"
            fi
          done
