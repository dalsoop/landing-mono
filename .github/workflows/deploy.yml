name: deploy

on:
  push:
    branches: [main]
    paths: ["apps/**", "router/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WORKER_NAME: landing-mono
  ROOT_DOMAIN: external.kr

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::저장소 시크릿 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 가 필요합니다(README 의 저장소 설정 참고)."
            exit 1
          fi
      - name: build
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          routes="[]"
          for dir in apps/*/; do
            site=$(basename "$dir")
            if ! echo "$site" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
              echo "::error::apps/$site: 폴더 이름은 도메인에 쓸 수 있는 소문자·숫자·하이픈이어야 합니다."
              exit 1
            fi
            if [ ! -f "$dir/index.html" ]; then
              echo "::error::apps/$site: index.html 이 없습니다."
              exit 1
            fi
            cp -R "$dir" "dist/$site"
            routes=$(echo "$routes" | jq -c --arg p "$site.$ROOT_DOMAIN/*" --arg z "$ROOT_DOMAIN" '. + [{pattern: $p, zone_name: $z}]')
            echo "사이트: https://$site.$ROOT_DOMAIN"
          done
          jq -n --arg name "$WORKER_NAME" --argjson routes "$routes" '{
            name: $name,
            main: "router/worker.js",
            compatibility_date: "2025-09-01",
            assets: { directory: "dist", binding: "ASSETS", run_worker_first: true },
            routes: $routes
          }' > wrangler.json
          cat wrangler.json
      - name: deploy
        run: npx --yes wrangler@4 deploy --config wrangler.json
